<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Interactive, step-by-step walkthroughs of what Kevin Na's ML projects actually compute, with real numbers.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="./assets/site.css">
<link rel="stylesheet" href="./assets/home.css">
</head>
<body class="home-page">
<main class="home">
  <section class="hero">
    <p class="eyebrow">Kevin Na · project walkthroughs</p>
    <h1>Under the Hood</h1>
    <p class="lede">Interactive walkthroughs of what my projects actually compute, step by step, with real numbers.</p>
  </section>

  <section id="cards" class="cards" aria-label="Projects">
    <noscript><p>This page needs JavaScript to list the projects.</p></noscript>
  </section>

  <section class="more" aria-labelledby="more-h">
    <h2 class="eyebrow" id="more-h">More</h2>
    <ul>
      <li><a href="https://kevinyjn1.github.io/smolvla-viz-site/">Inside SmolVLA</a><span class="muted">: a 3D walk through a robot policy</span></li>
      <li><a href="https://kevinyjn1.github.io/">My homepage</a></li>
    </ul>
  </section>
</main>

<footer class="site-foot">
  <div class="inner">
    <span>Made by Kevin (Yun Jong) Na</span>
    <a href="https://github.com/kevinyjn1" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>github.com/kevinyjn1</a>
  </div>
</footer>

<script type="module">
import { topbar, githubButton } from './assets/stepper.js';
import { PROJECTS } from './assets/projects.js';
import { mountPreview } from './assets/previews.js';

document.body.prepend(topbar(null, './'));

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cards = document.getElementById('cards');
cards.innerHTML = PROJECTS.map(p => `
  <article class="card" data-slug="${esc(p.slug)}">
    <a class="preview" href="./${esc(p.slug)}/" tabindex="-1" aria-hidden="true"><canvas></canvas></a>
    <div class="card-body">
      <span class="tag">${esc(p.model)}</span>
      <h2>${esc(p.title)}</h2>
      <p class="blurb">${esc(p.blurb)}</p>
      ${p.team ? `<p class="team">${esc(p.team)}</p>` : ''}
      <div class="actions">
        <a class="btn primary" href="./${esc(p.slug)}/">Open the visualization</a>
        ${p.repo ? githubButton(esc(p.repo)) : ''}
      </div>
    </div>
  </article>`).join('');
cards.querySelectorAll('.card').forEach(c => mountPreview(c.querySelector('canvas'), c.dataset.slug));
</script>
</body>
</html>
